name: Usage Bar
on:
  push:
    branches: [main, personal-usage-bar]
    paths: ['UsageBar/**', 'Scripts/install_lint_tools.sh', '.github/workflows/usage-bar.yml']
  pull_request:
    paths: ['UsageBar/**', 'Scripts/install_lint_tools.sh', '.github/workflows/usage-bar.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: usage-bar-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    defaults:
      run:
        working-directory: UsageBar
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
      - run: swift --version
      - run: make test check package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Usage-Bar-macOS
          path: UsageBar/dist/
          if-no-files-found: error
